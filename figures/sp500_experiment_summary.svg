<circle cx="316" cy="356.2" r="4" fill="#0891b2"/>
<circle cx="482" cy="351.7" r="4" fill="#0891b2"/>

<polyline points="150,260.4 316,306.4 482,306.4" fill="none" stroke="#dc2626" stroke-width="2.6"/>
<circle cx="150" cy="260.4" r="4" fill="#dc2626"/>
<circle cx="316" cy="306.4" r="4" fill="#dc2626"/>
<circle cx="482" cy="306.4" r="4" fill="#dc2626"/>

<rect x="84" y="478" width="12" height="12" rx="3" fill="#2563eb"/>
<text class="legend" x="102" y="488">Acc</text>
<rect x="154" y="478" width="12" height="12" rx="3" fill="#16a34a"/>
<text class="legend" x="172" y="488">Macro-F1</text>
<rect x="260" y="478" width="12" height="12" rx="3" fill="#d97706"/>
<text class="legend" x="278" y="488">Precision</text>
<rect x="370" y="478" width="12" height="12" rx="3" fill="#0891b2"/>
<text class="legend" x="388" y="488">Recall</text>
<rect x="462" y="478" width="12" height="12" rx="3" fill="#dc2626"/>
