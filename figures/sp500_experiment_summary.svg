<text class="panel-title" x="620" y="180">Final Prediction Coverage</text>
<text class="subtitle" x="620" y="199">Epoch 10 predictions versus validation labels.</text>

<text class="label" x="620" y="242">Stress regime</text>
<rect x="620" y="256" width="220" height="14" rx="4" fill="#e2e8f0"/>
