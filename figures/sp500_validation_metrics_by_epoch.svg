<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-labelledby="title desc">
<title id="title">S&amp;P 500 Validation Metrics by Epoch</title>
<desc id="desc">Line chart for epochs 1 through 10 of the capped H200 S&amp;P 500 pilot, showing validation accuracy, macro-F1, transition precision, transition recall, and transition ROC-AUC.</desc>
<style>
  text { font-family: 'Aptos', 'Helvetica Neue', Arial, sans-serif; fill: #1f2933; }
  .title { font-size: 22px; font-weight: 700; }
  .subtitle { font-size: 13px; fill: #64748b; }
  .axis { stroke: #334155; stroke-width: 1.2; }
  .grid { stroke: #d8dee9; stroke-width: 1; }
  .tick { font-size: 12px; fill: #475569; }
  .label { font-size: 12px; fill: #334155; }
  .legend { font-size: 13px; fill: #334155; }
  .note { font-size: 11px; fill: #64748b; }
  .line { fill: none; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
</style>
<rect width="940" height="520" rx="18" fill="#fbfaf6"/>

<text class="title" x="76" y="38">S&amp;P 500 Validation Metrics by Epoch</text>
<text class="subtitle" x="76" y="60">Capped 500-stock H200 pilot, epochs 1-10, sequence length 10.</text>

